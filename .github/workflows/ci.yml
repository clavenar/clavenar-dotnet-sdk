name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [self-hosted, windows-latest, macos-latest]
    steps:
      - name: Attach retained self-hosted checkout commit
        if: matrix.os == 'self-hosted'
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated .NET state
        if: matrix.os == 'self-hosted'
        run: |
          state_root="$RUNNER_TEMP/dotnet-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$state_root/install" "$state_root/home" "$state_root/packages"
          echo "DOTNET_INSTALL_DIR=$state_root/install" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$state_root/home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$state_root/packages" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.423'
      - run: dotnet restore
      - run: dotnet format --verify-no-changes
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  sbom:
    name: sbom
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Prepare isolated .NET state
        run: |
          state_root="$RUNNER_TEMP/dotnet-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$state_root/install" "$state_root/home" "$state_root/packages"
          echo "DOTNET_INSTALL_DIR=$state_root/install" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=$state_root/home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$state_root/packages" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.423'
      - run: dotnet restore
      - run: dotnet list package --vulnerable --include-transitive
      - name: SBOM (CycloneDX)
        run: |
          tool_root="$RUNNER_TEMP/dotnet-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          dotnet tool install --tool-path "$tool_root" CycloneDX --version 6.2.0
          "$tool_root/dotnet-CycloneDX" Clavenar.AgentSdk.sln -o sbom
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: sbom/
