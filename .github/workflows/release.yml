name: release

# Push a tag matching v* (e.g. v1.0.0) that equals the csproj <Version> to
# publish to NuGet.org. Requires a NUGET_API_KEY repo secret (and the
# reserved Clavenar.* prefix). See CONTRIBUTING.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.423'

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Clavenar.AgentSdk/Clavenar.AgentSdk.csproj)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' (version '$TAG') does not match csproj '$VER'"
            exit 1
          fi

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
