name: release
run-name: publish ${{ github.event.client_payload.publication_id }}

on:
  repository_dispatch:
    types: [clavenar-protected-publication]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" update-ref refs/clavenar/runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.client_payload.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          dotnet-version: '8.0.423'

      - name: Verify protected publication input
        env:
          COMPONENT_VERSION: ${{ github.event.client_payload.component_version }}
          RELEASE_REFERENCE: ${{ github.event.client_payload.release_reference }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          test "$GITHUB_ACTOR" = "vanteguardlabs"
          [[ "$RELEASE_REFERENCE" =~ ^ghcr\.io/clavenar/clavenar-stack-release@sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          VER="$(grep -oPm1 '(?<=<Version>)[^<]+' src/Clavenar.AgentSdk/Clavenar.AgentSdk.csproj)"
          if [ "$COMPONENT_VERSION" != "$VER" ]; then
            echo "::error::protected component version does not match csproj '$VER'"
            exit 1
          fi

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet test --no-build -c Release
      - run: dotnet pack --no-build -c Release -o artifacts

      - name: Check whether this exact NuGet package is already published
        id: registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.client_payload.component_version }}
        run: |
          if gh api --paginate \
            "orgs/clavenar/packages/nuget/Clavenar.AgentSdk/versions?per_page=100" \
            --jq '.[].name' | grep -Fxq "$VERSION"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages NuGet registry
        if: steps.registry.outputs.exists == 'false'
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/clavenar/index.json

      - name: Publish the exact source tag and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.client_payload.component_version }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')" = "$SOURCE_SHA"
            gh release upload "$tag" artifacts/* --clobber
          else
            existing="$(git ls-remote --refs origin "refs/tags/$tag" |
              awk '{print $1}')"
            if [ -n "$existing" ]; then
              test "$existing" = "$SOURCE_SHA"
            else
              git push origin "$SOURCE_SHA:refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag \
              --title "$tag — Clavenar.AgentSdk" \
              --notes "Published from the accepted protected Clavenar release." \
              artifacts/*
          fi
